name: Image
on:
  push:
    branches-ignore:
      - 'copilot/**'
      - 'dependabot/**'
    tags:
      - '**'
  pull_request:
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        torch-backend:
          - cpu
          - cu126
          - cu128
          - cu130
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          # CUDA images are large.
          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
      - name: Prepare
        run: |
          set -x
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version=main
          fi
          image="ghcr.io/${GITHUB_REPOSITORY}"
          tags="${image}:${{ matrix.torch-backend }}-${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${image}:${{ matrix.torch-backend }}-latest"
          fi
          if [ "${{ matrix.torch-backend }}" = "cpu" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              tags="${tags},${image}:latest"
            else
              tags="${tags},${image}:main"
            fi
          fi

          need_push="no"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            need_push="yes"
          fi
          echo "TAGS=${tags}" >> ${GITHUB_ENV}
          echo "NEED_PUSH=${need_push}" >> ${GITHUB_ENV}
      - uses: docker/login-action@v4
        if: env.NEED_PUSH == 'yes'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - uses: docker/build-push-action@v7
        id: docker_build
        with:
          build-args: >-
            TORCH_BACKEND=${{ matrix.torch-backend }}
          context: .
          file: Dockerfile
          push: ${{ env.NEED_PUSH == 'yes' }}
          load: ${{ env.NEED_PUSH != 'yes' }}
          tags: ${{ env.TAGS }}
