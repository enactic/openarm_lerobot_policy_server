[project]
name = "openarm_lerobot_policy_server"
version = "0.1.0"
authors = [{ name = "Enactic, Inc." }]
description = "LeRobot policy servers for OpenArm inference with dora-rs"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "lerobot==0.6.1",
  "pyarrow",
]

[project.urls]
Changelog = "https://github.com/enactic/openarm_lerobot_policy_server/releases"
Issues = "https://github.com/enactic/openarm_lerobot_policy_server/issues"
Repository = "https://github.com/enactic/openarm_lerobot_policy_server"

[project.scripts]
openarm-lerobot-policy-server-docker = "openarm_lerobot_policy_server.docker:main"
openarm-lerobot-policy-server-local = "openarm_lerobot_policy_server.local:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
extend-select = [
  "D",   # pydocstyle
  "UP"
]

[tool.ruff.lint.per-file-ignores]
"!src/**.py" = ["D"]
